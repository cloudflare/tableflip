[program:myservice]
command=/usr/local/bin/tableflip-supervisor /run/myservice.pid -- /usr/local/bin/myservice -pid-file /run/myservice.pid
user=myservice
directory=/var/lib/myservice
autostart=true
autorestart=true
startsecs=5
startretries=3
stopsignal=TERM
stopwaitsecs=30
killasgroup=true
redirect_stderr=true
stdout_logfile=/var/log/myservice.log
